<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <meta name="description" content="Projects and a little about Micah VanEwyk, a developer and IT guy in Southwestern Ontario." />
    <meta name="theme-color" content="#f6f2e7" />
    <!-- The typeface the intro draws with, fetched before the CSS asks for it. -->
    <link rel="preload" href="/fonts/Libron-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Runs before paint: enables scroll reveals, sets the time of day and the light/dark theme
      // (so there is no flash of the wrong one), and plays the intro on every load of the home page.
      (function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          // Same hours as src/lib/daypart.ts; ?time= previews another part of the day.
          var asked = new URLSearchParams(location.search).get('time')
          var hour = new Date().getHours()
          var daypart = /^(morning|day|evening|night)$/.test(asked || '') ? asked
            : hour >= 5 && hour < 11 ? 'morning' : hour >= 11 && hour < 17 ? 'day' : hour >= 17 && hour < 23 ? 'evening' : 'night'
          root.setAttribute('data-daypart', daypart)
          // Dark at night, light otherwise, unless the visitor switched it during this visit.
          var theme = null
          try { theme = sessionStorage.getItem('sedes:theme') } catch (error) {}
          root.setAttribute('data-theme', theme === 'light' || theme === 'dark' ? theme : daypart === 'night' ? 'dark' : 'light')
        } catch (error) {}
        try {
          var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (location.pathname === '/' && !calm) {
            root.classList.add('intro')
            // If the page script never takes over the intro, show the page anyway.
            setTimeout(function () { if (!root.classList.contains('intro-owned')) root.classList.remove('intro') }, 4000)
          }
        } catch (error) {}
      })()
    </script>
    <title>Micah VanEwyk, Developer &amp; IT Professional | Sedes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

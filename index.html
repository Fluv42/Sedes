<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <meta name="description" content="Micah VanEwyk is an IT specialist and developer in Southwestern Ontario. Projects, a bit about him, and how to get in touch." />
    <!-- Link previews (LinkedIn, Slack, iMessage, Discord); the build fills in each page's own. -->
    <link rel="canonical" href="https://sedes.ca/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sedes" />
    <meta property="og:title" content="Micah VanEwyk, Developer &amp; IT Professional | Sedes" />
    <meta property="og:description" content="Micah VanEwyk is an IT specialist and developer in Southwestern Ontario. Projects, a bit about him, and how to get in touch." />
    <meta property="og:url" content="https://sedes.ca/" />
    <meta property="og:image" content="https://sedes.ca/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Micah VanEwyk, IT specialist and developer in Southwestern Ontario, beside a wheat field at sunset" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f2e7" />
    <!-- The typeface the intro draws with, fetched before the CSS asks for it. -->
    <link rel="preload" href="/fonts/Libron-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Runs before paint: enables scroll reveals, sets the time of day and the light/dark theme
      // (so there is no flash of the wrong one), and plays the intro on every load of the home page.
      (function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          // Same hours as src/lib/daypart.ts; ?time= previews another part of the day.
          var asked = new URLSearchParams(location.search).get('time')
          var hour = new Date().getHours()
          var daypart = /^(morning|day|evening|night)$/.test(asked || '') ? asked
            : hour >= 5 && hour < 11 ? 'morning' : hour >= 11 && hour < 17 ? 'day' : hour >= 17 && hour < 23 ? 'evening' : 'night'
          root.setAttribute('data-daypart', daypart)
          // Dark at night, light otherwise, on every load; the Light/Dark button changes it until then.
          root.setAttribute('data-theme', daypart === 'night' ? 'dark' : 'light')
        } catch (error) {}
        try {
          var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (location.pathname === '/' && !calm) {
            root.classList.add('intro')
            // If the page script never takes over the intro, show the page anyway.
            setTimeout(function () { if (!root.classList.contains('intro-owned')) root.classList.remove('intro') }, 4000)
          }
        } catch (error) {}
      })()
    </script>
    <title>Micah VanEwyk, Developer &amp; IT Professional | Sedes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

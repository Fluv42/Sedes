<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <meta name="description" content="Micah VanEwyk’s home for software, projects and notes. Developer and IT professional in Southwestern Ontario." />
    <meta name="theme-color" content="#f6f2e7" />
    <script>
      // Runs before paint: enables scroll reveals, and plays the intro once per visit on the home page.
      (function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          // Every load while developing; once per visit on the real site.
          var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
          if (location.pathname === '/' && !calm && (local || !sessionStorage.getItem('sedes:intro'))) {
            root.classList.add('intro')
            sessionStorage.setItem('sedes:intro', '1')
            // If the page script never takes over the intro, show the page anyway.
            setTimeout(function () { if (!root.classList.contains('intro-owned')) root.classList.remove('intro') }, 4000)
          }
        } catch (error) {}
      })()
    </script>
    <title>Micah VanEwyk — Developer &amp; IT Professional | Sedes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
